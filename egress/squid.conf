# Nodara Rolling Forecast · egress gateway (default deny).
# Only HTTPS tunnels (CONNECT :443) to the allowlisted domains leave the enclave; plain HTTP,
# other ports and any other domain are refused. Allowlist changes require Architect approval.
http_port 3128

acl allowlisted dstdomain "/etc/squid/allowlist.txt"
acl https_port port 443
acl CONNECT method CONNECT

http_access deny !CONNECT
http_access deny CONNECT !https_port
http_access allow CONNECT allowlisted
http_access deny all

# Fail fast on an unreachable upstream; never cut a streaming answer before the backend's own
# per-attempt timeout (NIM_TIMEOUT_S) does.
connect_timeout 10 seconds
read_timeout 90 seconds

# Pure forwarder: no cache, no identifying headers.
cache deny all
forwarded_for delete
via off
httpd_suppress_version_string on
coredump_dir /var/spool/squid
