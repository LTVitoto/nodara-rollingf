# Delta Lake on MinIO (bronze/silver/gold). Tables written by delta-sink are registered
# via system.register_table; the file metastore lives in the same bucket as the data.
connector.name=delta_lake
hive.metastore=file
hive.metastore.catalog.dir=s3://lakehouse/_metastore
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:LAKEHOUSE_S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:LAKEHOUSE_S3_SECRET_KEY}
delta.register-table-procedure.enabled=true
delta.enable-non-concurrent-writes=true
